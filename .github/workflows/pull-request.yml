name: Build

on:
  workflow_dispatch: {}
  pull_request:
    paths-ignore:
      - docs
      - .devcontainer
      - examples

permissions:
  contents: read

jobs:
  build_sdk:
    name: Build SDKs ${{ matrix.language }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: true
      matrix:
        dotnetversion:
          - 10.0.x
        goversion:
          - 1.26.x
        nodeversion:
          - 25.x
        pythonversion:
          - "3.12"
        language:
          - nodejs
          - python
          - dotnet
          - go

    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Unshallow clone for tags
      run: git fetch --prune --unshallow --tags
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{matrix.goversion}}

    - name: Install pulumictl
      uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
      with:
        repo: pulumi/pulumictl

    - name: Install pulumi
      uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
      with:
       pulumi-version: v3.218.0

    - if: ${{ matrix.language == 'nodejs'}}
      name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # No registry-url: it makes setup-node write an .npmrc containing
        # ${NODE_AUTH_TOKEN}, and yarn v1 hard-fails ("Failed to replace env in
        # config") when that variable is unset. This job only installs public
        # deps; publishing happens in release.yml via npm-publish + NPM_TOKEN.
        node-version: ${{matrix.nodeversion}}

    - if: ${{ matrix.language == 'dotnet'}}
      name: Setup DotNet
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{matrix.dotnetversion}}

    - if: ${{ matrix.language == 'python'}}
      name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{matrix.pythonversion}}

    - if: ${{ matrix.language == 'java'}}
      name: Setup Java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        cache: gradle
        distribution: temurin
        java-version: ${{matrix.javaversion}}

    - name: Build SDK
      run: make build_${{ matrix.language }}

