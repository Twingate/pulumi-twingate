name: Release

on:
  push:
    tags:
      - v*.*.*
    paths-ignore:
      - docs
      - .devcontainer
      - examples

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PUBLISH_NPM: true
  NPM_REGISTRY_URL: https://registry.npmjs.org
  NUGET_PUBLISH_KEY: ${{ secrets.NUGET_PUBLISH_KEY }}
  NUGET_FEED_URL: https://api.nuget.org/v3/index.json
  PUBLISH_NUGET: true
  PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
  PYPI_USERNAME: "__token__"
  PYPI_REPOSITORY_URL: ""
  PUBLISH_PYPI: true

jobs:
  publish_binary:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unshallow clone for tags
        run: git fetch --prune --unshallow --tags

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{matrix.goversion}}

      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: pulumi/pulumictl

      - name: Install pulumi
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          pulumi-version: v3.218.0

      - name: Set temporary GOMODCACHE
        run: echo "GOMODCACHE=$(mktemp -d)" >> $GITHUB_ENV

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: -p 3 release --clean
          version: "~> v2"

    strategy:
      fail-fast: true
      matrix:
        goversion:
          - 1.26.x

  publish_sdk:
    name: Publish SDKs ${{ matrix.language }}
    runs-on: ubuntu-latest
    needs: publish_binary
    permissions:
      contents: read
      id-token: write  # Required for OIDC/npm provenance
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unshallow clone for tags
        run: git fetch --prune --unshallow --tags

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.goversion }}

      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: pulumi/pulumictl

      - name: Install pulumi
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          pulumi-version: v3.218.0

      - if: ${{ matrix.language == 'nodejs'}}
        name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{matrix.nodeversion}}

      - if: ${{ matrix.language == 'dotnet'}}
        name: Setup DotNet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{matrix.dotnetversion}}

      - if: ${{ matrix.language == 'java'}}
        name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          cache: gradle
          distribution: temurin
          java-version: ${{matrix.javaversion}}

      - if: ${{ matrix.language == 'python'}}
        name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{matrix.pythonversion}}

      - name: Build SDK
        run: make build_${{ matrix.language }}

      # - name: Check worktree clean
      #   run: |
      #     git update-index -q --refresh
      #     if ! git diff-files --quiet; then
      #         >&2 echo "error: working tree is not clean, aborting!"
      #         git status
      #         git diff
      #         exit 1
      #     fi

      - if: ${{ matrix.language == 'python' && env.PUBLISH_PYPI == 'true' }}
        name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages_dir: ${{github.workspace}}/sdk/python/bin/dist
          skip-existing: true # Skip upload if version already exists on PyPI

      - if: ${{ matrix.language == 'nodejs' && env.PUBLISH_NPM == 'true' }}
        name: Determine npm tag
        id: npm-tag
        run: |
          VERSION=$(node -p "require('${{github.workspace}}/sdk/nodejs/bin/package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            # Prerelease version (contains hyphen) - extract prerelease tag
            # e.g., 3.7.0-dev -> dev, 3.7.0-alpha.1 -> alpha, 3.7.0-beta.2 -> beta
            TAG=$(echo "$VERSION" | sed -n 's/.*-\([^.]*\).*/\1/p')
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "Publishing prerelease version $VERSION with tag: $TAG"
          else
            # Stable version - use latest
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "Publishing stable version $VERSION with tag: latest"
          fi

      - if: ${{ matrix.language == 'nodejs' && env.PUBLISH_NPM == 'true' }}
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          access: "public"
          token: ${{ secrets.NPM_TOKEN }}
          package: ${{github.workspace}}/sdk/nodejs/bin/package.json
          tag: ${{ steps.npm-tag.outputs.tag }}
          provenance: true  # Enable npm provenance with OIDC
          check-version: true # Skip publishing if version already exists on npm

      - if: ${{ matrix.language == 'dotnet' && env.PUBLISH_NUGET == 'true' }}
        name: publish nuget package
        run: |
          dotnet nuget push ${{github.workspace}}/sdk/dotnet/bin/Debug/*.nupkg -s ${{ env.NUGET_FEED_URL }} -k ${{ env.NUGET_PUBLISH_KEY }} --skip-duplicate
          echo "done publishing packages"

    strategy:
      fail-fast: true
      matrix:
        dotnetversion:
          - 10.0.x
        goversion:
          - 1.26.x
        nodeversion:
          - 25.x
        pythonversion:
          - "3.12"
        language:
          - nodejs
          - python
          - dotnet
          - go

  create_sdk_tag:
    name: Create SDK Tag
    runs-on: ubuntu-latest
    needs: publish_sdk
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create and Push SDK Tag
        run: |
          # Extract version from tag (e.g., refs/tags/v3.5.1 -> v3.5.1)
          VERSION=${GITHUB_REF#refs/tags/}

          echo "Creating SDK tag for version: $VERSION"

          # Create SDK tag pointing to the same commit as the main tag
          git tag "sdk/$VERSION"

          # Push SDK tag
          git push origin "sdk/$VERSION"

          echo "✅ Created and pushed tag: sdk/$VERSION"
