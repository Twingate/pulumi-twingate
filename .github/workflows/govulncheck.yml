# Scans the provider and the published Go SDK for known vulnerabilities in Go
# modules AND the Go standard library. Dependabot alerts don't cover stdlib CVEs,
# and GitHub's advisory DB and the Go vuln DB can disagree on affected ranges
# (e.g. GO-2026-6865 in klauspost/compress), so this catches what Dependabot misses.
name: govulncheck
permissions:
  contents: read
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # New advisories land without any code change, so re-scan main weekly.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module:
          - provider
          - sdk
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same Go line as release.yml (1.26.x), so stdlib results match what we ship.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...
